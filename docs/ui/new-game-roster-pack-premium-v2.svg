  <text x="76" y="447" font-family="Arial" font-size="12" letter-spacing="1.4" fill="#77818e">COVERAGE</text>
  <text x="76" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#f5f7fa">32</text><text x="118" y="482" font-family="Arial" font-size="13" fill="#949eaa">major clubs</text>
  <text x="240" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#f5f7fa">32</text><text x="282" y="482" font-family="Arial" font-size="13" fill="#949eaa">affiliates</text>
  <text x="405" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#f5f7fa">100%</text><text x="470" y="482" font-family="Arial" font-size="13" fill="#949eaa">complete</text>
  <rect x="76" y="514" width="476" height="92" rx="14" fill="#101318" stroke="#282e36"/>
  <text x="94" y="541" font-family="Arial" font-size="13" font-weight="700" fill="#dfe5eb">Management consequences</text>
  <text x="94" y="565" font-family="Arial" font-size="13" fill="#9aa4af">Contracts, ratings and prospect histories are simulation-native.</text>
  <text x="94" y="587" font-family="Arial" font-size="13" fill="#9aa4af">Best for a complete, internally consistent long-term universe.</text>
  <rect x="76" y="630" width="164" height="46" rx="12" fill="#20252c"/><text x="158" y="658" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e6ebef">View details</text>
