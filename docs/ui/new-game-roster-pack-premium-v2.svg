    <rect x="596" y="274" width="520" height="468" rx="22" fill="url(#selected)" stroke="#65bfff" stroke-width="2"/>
    <rect x="1138" y="274" width="248" height="468" rx="22" fill="url(#card)" stroke="#303640"/>
  </g>

  <rect x="76" y="294" width="112" height="30" rx="15" fill="#20252c"/><text x="132" y="314" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#c9d0d8">FULLY READY</text>
  <circle cx="112" cy="367" r="31" fill="#1b222b" stroke="#7c8795"/><text x="112" y="374" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#e8edf2">FL</text>
  <text x="158" y="360" font-family="Arial" font-size="20" font-weight="750" fill="#f2f5f8">Fictional League</text>
  <text x="158" y="384" font-family="Arial" font-size="14" fill="#929ca8">Original teams · complete simulation data</text>
