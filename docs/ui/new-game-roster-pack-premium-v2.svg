<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Premium new game roster pack selection Stage 1 direction</title>
  <desc id="desc">A premium black hockey management interface with fictional franchise identity, elevated roster source cards, realistic dense data, explicit uncertainty, and a blocked non-ideal state.</desc>
  <defs>
    <radialGradient id="ambient" cx="22%" cy="0%" r="90%"><stop offset="0" stop-color="#15395b" stop-opacity=".45"/><stop offset=".42" stop-color="#07111d" stop-opacity=".18"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16191e"/><stop offset=".55" stop-color="#0d1014"/><stop offset="1" stop-color="#080a0d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171a20"/><stop offset="1" stop-color="#0d0f13"/></linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142a3d"/><stop offset=".6" stop-color="#10171f"/><stop offset="1" stop-color="#0d0f13"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5bb8ff"/><stop offset="1" stop-color="#9bd5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="iceLines" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><path d="M0 0H96" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1440" height="900" fill="#000000"/>
  <rect width="1440" height="900" fill="url(#ambient)"/>
  <rect width="1440" height="900" fill="url(#iceLines)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="30" width="1356" height="132" rx="24" fill="url(#hero)" stroke="#2d333c"/>
  </g>
  <rect x="42" y="30" width="6" height="132" rx="3" fill="url(#accent)"/>
  <circle cx="112" cy="96" r="46" fill="#0b1118" stroke="#74c4ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M88 104L112 61l24 43-24 18z" fill="#5bb8ff" opacity=".22"/>
  <text x="112" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#f7fbff">BH</text>
  <text x="178" y="77" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#78c7ff">FRANCHISE SETUP</text>
  <text x="178" y="110" font-family="Arial, sans-serif" font-size="30" font-weight="750" fill="#f5f7fa">Buffalo Harbor Northstars</text>
  <text x="178" y="137" font-family="Arial, sans-serif" font-size="15" fill="#9fa8b4">2025–26 · Rochester Forge affiliate · Harbor Center Arena</text>
  <rect x="1123" y="70" width="226" height="52" rx="14" fill="#11161c" stroke="#343b45"/>
  <text x="1236" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#8693a2">NEW GAME</text>
  <text x="1236" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#eef3f7">Step 2 of 4 · Roster Source</text>

  <text x="54" y="211" font-family="Arial, sans-serif" font-size="26" font-weight="750" fill="#f5f7fa">Choose the hockey world you will manage</text>
  <text x="54" y="239" font-family="Arial, sans-serif" font-size="15" fill="#8f99a6">Compare authenticity, completeness and simulation consequences before creating the save.</text>

  <g filter="url(#shadow)">
