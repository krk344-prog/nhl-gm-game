  <rect x="618" y="294" width="130" height="30" rx="15" fill="#123651" stroke="#4faef2"/><text x="683" y="314" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#bfe5ff">SELECTED</text>
  <rect x="958" y="294" width="136" height="30" rx="15" fill="#3a2712" stroke="#c98a32"/><text x="1026" y="314" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#ffd28d">NEEDS REVIEW</text>
  <circle cx="654" cy="367" r="31" fill="#122231" stroke="#65bfff"/><text x="654" y="374" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#dff2ff">PA</text>
  <text x="700" y="360" font-family="Arial" font-size="20" font-weight="750" fill="#f2f7fb">Reviewed Pro/Affiliate Pack</text>
  <text x="700" y="384" font-family="Arial" font-size="14" fill="#9eb1c1">Real identity fields · generated simulation layers</text>
  <line x1="618" y1="412" x2="1094" y2="412" stroke="#31506a"/>
  <text x="618" y="447" font-family="Arial" font-size="12" letter-spacing="1.4" fill="#7fa8c6">DATA CONFIDENCE</text>
  <text x="618" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#f5f7fa">32/32</text><text x="700" y="482" font-family="Arial" font-size="13" fill="#9eabb6">pro clubs</text>
  <text x="802" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#f5f7fa">31/32</text><text x="884" y="482" font-family="Arial" font-size="13" fill="#9eabb6">affiliates</text>
  <text x="988" y="482" font-family="Arial" font-size="28" font-weight="750" fill="#ffcc7a">1</text><text x="1010" y="482" font-family="Arial" font-size="13" fill="#9eabb6">blocker</text>
  <rect x="618" y="514" width="476" height="92" rx="14" fill="#13100c" stroke="#6d4a20"/>
  <path d="M642 541l10 18h-20z" fill="#ffbd5c"/><text x="666" y="547" font-family="Arial" font-size="13" font-weight="700" fill="#ffd28d">Selection blocked</text>
  <text x="642" y="574" font-family="Arial" font-size="13" fill="#d9c3a4">Coastal City affiliate has no reviewed player snapshot.</text>
  <text x="642" y="594" font-family="Arial" font-size="12" fill="#a99476">Resolve source provenance or choose the fictional league.</text>
  <rect x="618" y="630" width="164" height="46" rx="12" fill="#202831" stroke="#354554"/><text x="700" y="658" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e8f2f8">View preflight</text>
  <rect x="794" y="630" width="300" height="46" rx="12" fill="#16212a" stroke="#365064"/><text x="944" y="658" text-anchor="middle" font-family="Arial" font-size="14" font-weight="750" fill="#7d8d99">Resolve blocker to continue</text>
  <text x="618" y="711" font-family="Arial" font-size="12" fill="#83929e">Real identity</text><circle cx="704" cy="707" r="4" fill="#69c3ff"/>
  <text x="722" y="711" font-family="Arial" font-size="12" fill="#83929e">Generated ratings</text><rect x="828" y="703" width="8" height="8" fill="none" stroke="#a7b1bb"/>
  <text x="852" y="711" font-family="Arial" font-size="12" fill="#83929e">Unknown contracts</text><path d="M976 703h8v8h-8z" fill="#ffbd5c"/>

  <text x="1162" y="316" font-family="Arial" font-size="12" letter-spacing="1.5" fill="#788390">CREATION SUMMARY</text>
  <text x="1162" y="353" font-family="Arial" font-size="18" font-weight="750" fill="#f4f7f9">Northstars</text>
  <text x="1162" y="376" font-family="Arial" font-size="13" fill="#929ca8">Atlantic Division · Harbor Center</text>
  <line x1="1162" y1="402" x2="1362" y2="402" stroke="#2a3038"/>
  <text x="1162" y="432" font-family="Arial" font-size="12" fill="#788390">CAPTAIN</text><text x="1162" y="454" font-family="Arial" font-size="14" fill="#e6ebef">Marcus Vale · C</text>
  <text x="1162" y="489" font-family="Arial" font-size="12" fill="#788390">STARTING GOALIE</text><text x="1162" y="511" font-family="Arial" font-size="14" fill="#e6ebef">Eli Mercer · 91 OVR*</text>
  <text x="1162" y="546" font-family="Arial" font-size="12" fill="#788390">AFFILIATE</text><text x="1162" y="568" font-family="Arial" font-size="14" fill="#e6ebef">Rochester Forge</text>
  <rect x="1162" y="600" width="200" height="72" rx="12" fill="#101318" stroke="#29313a"/>
  <text x="1178" y="626" font-family="Arial" font-size="12" font-weight="700" fill="#cbd3db">Save integrity</text>
  <text x="1178" y="648" font-family="Arial" font-size="12" fill="#8f99a5">New game only</text><text x="1178" y="666" font-family="Arial" font-size="12" fill="#8f99a5">Existing saves untouched</text>
  <text x="1162" y="713" font-family="Arial" font-size="11" fill="#6f7985">* Generated simulation rating</text>

  <rect x="54" y="770" width="1332" height="84" rx="18" fill="#0c0f13" stroke="#272d35"/>
  <text x="78" y="802" font-family="Arial" font-size="13" font-weight="700" fill="#e1e6eb">Why this is premium, not decorative</text>
  <text x="78" y="827" font-family="Arial" font-size="13" fill="#8f99a5">Layered neutral surfaces, restrained franchise light, aligned comparison rows and explicit uncertainty preserve focus while creating depth.</text>
  <rect x="1187" y="789" width="175" height="46" rx="12" fill="#151a20" stroke="#3a424c"/><text x="1274" y="817" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#edf2f6">UI Review Pending</text>
</svg>