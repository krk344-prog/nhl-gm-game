<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">NHL GM Main Dashboard Direction Wireframe</title>
<desc id="desc">Premium information-dense desktop dashboard concept with navigation, franchise status, action queue, cap summary, schedule, scouting intelligence, roster health, and league context.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09111f"/><stop offset="1" stop-color="#121d30"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17345d"/><stop offset="1" stop-color="#0d2442"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  <style>
    .label{font:600 13px Arial,sans-serif;fill:#8fa3bd;letter-spacing:.6px}.title{font:700 28px Arial,sans-serif;fill:#f7f9fc}.h2{font:700 18px Arial,sans-serif;fill:#f7f9fc}.body{font:400 14px Arial,sans-serif;fill:#cbd5e1}.small{font:400 12px Arial,sans-serif;fill:#8fa3bd}.metric{font:700 25px Arial,sans-serif;fill:#ffffff}.nav{font:600 14px Arial,sans-serif;fill:#b7c4d7}.chip{font:700 11px Arial,sans-serif;fill:#dbeafe;letter-spacing:.5px}
  </style>
</defs>
