name: Alpha validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Python API base URL embedded in the tester APK (for example http://192.168.1.25:8000/api/v1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q src
      - name: Run backend and full-season tests
        run: python -m unittest discover -s tests -v

  android-bundle:
    runs-on: ubuntu-latest
    env:
      TECHNICAL_ALPHA_API_URL: ${{ inputs.api_base_url || 'http://127.0.0.1:8000/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate configured Alpha API URL
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$TECHNICAL_ALPHA_API_URL" in
            http://*|https://*) ;;
            *) echo "api_base_url must begin with http:// or https://" >&2; exit 1 ;;
          esac

          case "$TECHNICAL_ALPHA_API_URL" in
            *\?*|*\#*)
              echo "api_base_url must not contain a query string or fragment." >&2
              exit 1
              ;;
          esac

          normalized_api_url="${TECHNICAL_ALPHA_API_URL%/}"
          case "$normalized_api_url" in
            */api/v1) ;;
            *)
              echo "api_base_url must end with /api/v1 so the packaged app reaches the authoritative API route." >&2
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            endpoint_host="${TECHNICAL_ALPHA_API_URL#*://}"
            endpoint_host="${endpoint_host%%/*}"
            endpoint_host="${endpoint_host%%:*}"
            case "$endpoint_host" in
              localhost|127.*|0.0.0.0|::1)
                echo "Manual tester builds require a non-loopback API endpoint reachable from the Android device." >&2
                exit 1
                ;;
            esac
          fi
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Export Android production bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ env.TECHNICAL_ALPHA_API_URL }}
        run: npx expo export --platform android --output-dir /tmp/nhl-gm-android
      - name: Generate native Android project
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ env.TECHNICAL_ALPHA_API_URL }}
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build installable Technical Alpha APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.TECHNICAL_ALPHA_API_URL }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Package tester artifacts with portable integrity manifests
        working-directory: /tmp
        run: |
          tar -czf nhl-gm-android-export.tar.gz nhl-gm-android
          cp "$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/debug/app-debug.apk" nhl-gm-technical-alpha.apk
          sha256sum nhl-gm-android-export.tar.gz > nhl-gm-android-export.sha256
          sha256sum nhl-gm-technical-alpha.apk > nhl-gm-technical-alpha.apk.sha256
          printf 'commit=%s\napi_base_url=%s\nbuild_type=debug-apk\n' \
            "$GITHUB_SHA" "$TECHNICAL_ALPHA_API_URL" > technical-alpha-build.txt
      - name: Upload Technical Alpha Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nhl-gm-technical-alpha-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nhl-gm-android-export.tar.gz
            /tmp/nhl-gm-android-export.sha256
            /tmp/nhl-gm-technical-alpha.apk
            /tmp/nhl-gm-technical-alpha.apk.sha256
            /tmp/technical-alpha-build.txt
          if-no-files-found: error
          retention-days: 14
