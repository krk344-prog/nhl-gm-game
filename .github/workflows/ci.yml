name: Alpha validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q src
      - name: Run backend and full-season tests
        run: python -m unittest discover -s tests -v

  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Export Android production bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform android --output-dir /tmp/nhl-gm-android
      - name: Package Android export with integrity manifest
        run: |
          tar -C /tmp -czf /tmp/nhl-gm-android-export.tar.gz nhl-gm-android
          sha256sum /tmp/nhl-gm-android-export.tar.gz > /tmp/nhl-gm-android-export.sha256
      - name: Upload Technical Alpha Android export
        uses: actions/upload-artifact@v4
        with:
          name: nhl-gm-technical-alpha-android-export-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nhl-gm-android-export.tar.gz
            /tmp/nhl-gm-android-export.sha256
          if-no-files-found: error
          retention-days: 14
