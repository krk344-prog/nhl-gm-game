name: Alpha validation

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q src
      - name: Validate Stage 2 UI artifacts
        run: python scripts/validate_ui_artifacts.py
      - name: Run backend and full-season tests
        run: |
          set +e
          python -m unittest discover -s tests -q > /tmp/backend-tests.log 2>&1
          status=$?
          cat /tmp/backend-tests.log
          exit $status
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: /tmp/backend-tests.log
          if-no-files-found: error

  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Export Android production bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform android --output-dir /tmp/nhl-gm-android
